aid: fazwaz
name: FazWaz
description: FazWaz is a Thailand-based property technology company operating one of
  the most comprehensive real estate portals in Southeast Asia. Through fazwaz.com
  it aggregates residential and investment property listings — condos, houses, villas,
  and land for sale and rent — connecting buyers, sellers, renters, and agents across
  Thailand and neighboring markets, and pairs the consumer marketplace with agent
  tools, market data, and property-management services. FazWaz is backed by 500 Global.
  It runs an internal application API and a GraphQL endpoint that power its own web
  and mobile clients (both disallowed to crawlers in robots.txt); no public developer
  API, OpenAPI specification, or developer portal has been published at this time.
